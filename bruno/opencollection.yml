opencollection: 1.0.0

info:
  name: Algo Trading Worker

docs:
  content: |-
    # Bruno API Collection — Algo Trading Worker

    [Bruno](https://www.usebruno.com/) collection for testing and simulating trading signals against the algo-trading-worker service.

    ## Collection

    **Name:** Algo Trading Worker
    **File:** [bruno/opencollection.yml](bruno/opencollection.yml)

    ## Environments

    ### Localhost

    [bruno/environments/Localhost.yml](bruno/environments/Localhost.yml)

    | Variable | Default Value |
    | --- | --- |
    | `url` | `http://localhost:8000` |
    | `simulator_url` | `http://localhost:8001` |

    ## Folders

    ### Telegram

    [bruno/Telegram/](bruno/Telegram/)

    Utility requests for interacting with the Telegram Bot API directly.

    | Request | Method | URL | Description |
    | --- | --- | --- | --- |
    | getUpdates | GET | `https://api.telegram.org/bot<TOKEN>/getUpdates` | Poll for new messages/updates from the bot |

    ### e2e

    [bruno/e2e/](bruno/e2e/)

    End-to-end simulation requests that publish trading signals to the simulator endpoint (`{{simulator_url}}/simulator/publish`). These replicate the full signal lifecycle for XAUUSD.

    All requests POST JSON to `{{simulator_url}}/simulator/publish`.

    | # | Request | Action | Price | Quantity | is_running | Description |
    | --- | --- | --- | --- | --- | --- | --- |
    | 1 | [LONG.yml](bruno/e2e/LONG.yml) | `LONG` | 4858.50 | 6.0 | true | Open a long position with SL=4850, TP1=4865, TP2=4870, risk=3% |
    | 2 | [SHORT.yml](bruno/e2e/SHORT.yml) | `SHORT` | 4858.00 | 6.0 | true | Open a short position with SL=4865, TP1=4850, TP2=2340, risk=3% |
    | 3 | [TP1.yml](bruno/e2e/TP1.yml) | `TP1` | 4850.00 | 1.8 | true | Partial close — take profit on first target (30% of position) |
    | 4 | [TP2.yml](bruno/e2e/TP2.yml) | `TP2` | 4850.00 | 4.2 | false | Full close — take profit on second target (remaining 70%) |
    | 5 | [SL.yml](bruno/e2e/SL.yml) | `SL` | 4850.00 | 6.0 | false | Stop loss hit — close entire position at a loss |
    | 6 | [R_SL.yml](bruno/e2e/R_SL.yml) | `R_SL` | 4858.00 | 4.2 | false | Recurrent SL — trailing/re-entry stop loss signal |

    ### Signal Payload Schema

    ```json
    {
      "signal_id": "<uuid>",
      "timestamp": "<ISO 8601>",
      "action": "LONG | SHORT | TP1 | TP2 | SL | R_SL",
      "symbol": "XAUUSD",
      "price": 0.0,
      "quantity": 0.0,
      "sl": 0.0,       // only on LONG/SHORT
      "tp1": 0.0,      // only on LONG/SHORT
      "tp2": 0.0,      // only on LONG/SHORT
      "is_running": true,
      "risk_percent": 3.0
    }
    ```

    ## Usage

    1. Open Bruno and load the collection from the [bruno/](bruno/) folder.
    2. Select the **Localhost** environment.
    3. Ensure both services are running:
      - Worker: `http://localhost:8000`
      - Simulator: `http://localhost:8001`
    4. Run e2e requests in sequence (1 → 6) to simulate a full trade lifecycle, or fire individual signals as needed.
  type: text/markdown

bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
