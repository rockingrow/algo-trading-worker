[project]
name = "algo-trading-worker"
version = "1.1.2"
description = "Market execution worker listening to NATS signals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "nats-py>=2.6.0",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
    "loguru>=0.7.2",
    "requests>=2.31.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "binance-sdk-derivatives-trading-usds-futures>=10.4.0",
    "certifi>=2026.0.0",
    "emoji>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 88
indent-width = 2

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
]

[dependency-groups]
dev = [
    "watchfiles>=1.1.1",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
