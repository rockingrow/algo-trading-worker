# Crypto (CEX) worker stack for Linux hosts.
#
#   cp .env.example .env   # fill BINANCE_*, TELEGRAM_*, NATS_SUBJECTS, ...
#   docker compose up -d --build
#
# The MT5/FOREX worker is NOT containerized (it requires Windows + the MT5
# terminal) and keeps its native Windows deployment.

services:
  nats:
    image: nats:2.10-alpine
    container_name: algo-nats
    command: ["-m", "8222"]          # enable the HTTP monitoring port for healthcheck
    ports:
      - "4222:4222"                  # client
      - "8222:8222"                  # monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    container_name: algo-crypto-worker
    depends_on:
      nats:
        condition: service_healthy
    env_file: .env
    # These override .env so the container talks to the compose NATS service and
    # always runs the crypto market with a persistent DB path. The worker runs as
    # a single process (no HTTP server), so liveness is a heartbeat file.
    environment:
      MARKET_TYPE: CRYPTO
      NATS_URL: nats://nats:4222
      DB_FILE: /app/data/worker_data.sqlite
      HEARTBEAT_FILE: /app/data/heartbeat
    volumes:
      - worker-data:/app/data        # persist the SQLite DB + heartbeat across restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p=os.environ['HEARTBEAT_FILE']; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 60 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  worker-data:
