# Crypto (CEX) worker stack for Linux hosts.
#
#   cp .env.example .env   # fill BINANCE_*, TELEGRAM_*, SIGNAL_SUBJECTS, ...
#   docker compose up -d --build
#
# The MT5/FOREX worker is NOT containerized (it requires Windows + the MT5
# terminal) and keeps its native Windows deployment.

services:
  nats:
    image: nats:2.10-alpine
    container_name: algo-nats
    command: ["-m", "8222"]          # enable the HTTP monitoring port for healthcheck
    ports:
      - "4222:4222"                  # client
      - "8222:8222"                  # monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    container_name: algo-crypto-worker
    depends_on:
      nats:
        condition: service_healthy
    env_file: .env
    # These override .env so the container talks to the compose NATS service and
    # always runs the crypto market with a persistent DB path.
    environment:
      MARKET_TYPE: CRYPTO
      NATS_URL: nats://nats:4222
      DB_FILE: /app/data/worker_data.sqlite
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    volumes:
      - worker-data:/app/data        # persist the SQLite DB across restarts
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  worker-data:
